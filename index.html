*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:8px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stem div{margin-bottom:4px}.stem em{display:block;color:var(--mute);font-style:normal;font-size:15px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%}

.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.ex{margin-top:8px;padding:10px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:6px;font-size:15px}
.btn{font:inherit;font-weight:700;background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:12px 20px;cursor:pointer;width:100%}
.big{font-size:44px;font-weight:700;margin:4px 0}
.rev{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.rev span{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700}
.rev .y{background:var(--okbg);color:var(--ok)}.rev .n{background:var(--badbg);color:var(--bad)}
.tag{font-size:13px;color:var(--mute)}
</style></head><body><main id="app"></main>
