<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GK PYQ Series - Geography Quiz</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #fff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: none;
        }
        .container.active {
            display: block;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 { margin: 0; font-size: 24px; }
        .header p { margin: 5px 0 0; font-size: 14px; opacity: 0.8; }
        
        .login-screen {
            padding: 40px;
            text-align: center;
        }
        .login-screen input, .login-screen select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        .btn:hover { background: #2980b9; }
        .btn-accent { background: var(--accent); }
        .btn-accent:hover { background: #c0392b; }
        
        .quiz-area { padding: 30px; display: none; }
        .quiz-area.active { display: block; }
        
        .question-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--primary);
        }
        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options label {
            display: block;
            background: #f9f9f9;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #eee;
            transition: 0.2s;
        }
        .options label:hover { background: #eef5f9; border-color: var(--secondary); }
        .options input[type="radio"] { margin-right: 10px; }
        
        .nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .nav-buttons .btn { width: auto; flex: 1; }
        
        .result-screen { padding: 40px; text-align: center; display: none; }
        .result-screen.active { display: block; }
        .score { font-size: 48px; color: var(--secondary); font-weight: bold; margin: 20px 0; }
        
        .review-section { margin-top: 30px; text-align: left; }
        .review-item { padding: 15px; border-bottom: 1px solid #eee; }
        .review-item .q { font-weight: bold; }
        .review-item .correct { color: #27ae60; font-weight: bold; }
        .review-item .wrong { color: #e74c3c; text-decoration: line-through; }
        
        .lang-hi { display: none; }
        .lang-en { display: block; }
        .bilingual .lang-hi { display: block; margin-top: 5px; font-size: 0.9em; color: #555; }
        .bilingual .lang-en { display: block; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="container active" id="loginScreen">
        <div class="header">
            <h1>GK PYQ SERIES - Geography [Part 6]</h1>
            <p>Lecture 4 | Parmar SSC</p>
        </div>
        <div class="login-screen">
            <h3>Enter Your Details</h3>
            <input type="text" id="studentName" placeholder="Full Name" required>
            <select id="languageSelect">
                <option value="en">English</option>
                <option value="hi">Hindi (हिंदी)</option>
                <option value="bi">Bilingual (Both)</option>
            </select>
            <button class="btn" onclick="startQuiz()">Start Test</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div class="container" id="quizScreen">
        <div class="header">
            <h1>Geography Quiz</h1>
        </div>
        <div class="quiz-area active" id="quizArea">
            <div class="question-info">
                <span id="qCounter">Question 1 / 100</span>
                <span id="timer">00:00</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="nav-buttons">
                <button class="btn" onclick="prevQuestion()" id="prevBtn" style="background:#95a5a6;">Previous</button>
                <button class="btn" onclick="nextQuestion()" id="nextBtn">Next</button>
                <button class="btn btn-accent" onclick="submitQuiz()" id="submitBtn" style="display:none;">Submit</button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div class="container" id="resultScreen">
        <div class="header">
            <h1>Test Completed!</h1>
        </div>
        <div class="result-screen active">
            <h2 id="resultName"></h2>
            <div class="score" id="scoreDisplay">0 / 100</div>
            <p id="resultMsg"></p>
            <div class="review-section" id="reviewSection"></div>
            <button class="btn" onclick="location.reload()">Take Test Again</button>
        </div>
    </div>

    <script>
        // --- Questions Data (Extracted from PDF, expanded with statements) ---
        const questions = [
            {

                hi: "1. गंगा के जलोढ़ मैदानों में, निम्नलिखित में से कौन सी भौतिक विशेषता नहीं पाई जाती है?",
                options: { en: ["Oxbow lakes", "Rapids", "Meanders", "Braided channels"], hi: ["गोखुर झीलें", "रैपिड्स", "मेन्डर्स", "ब्रैडेड चैनल"] },
                answer: 1,
                expl: "Rapids are found in the youthful stage of rivers (upper course), not in the alluvial plains of Ganga."
            },
            {
                en: "2. Which of the following statements about the Indian Desert is/are correct? \n1. It lies to the west of the Aravali Hills \n2. It receives an average annual rainfall of over 250 mm.",
                hi: "2. भारतीय मरुस्थल के बारे में निम्नलिखित में से कौन सा/से कथन सही है/हैं? \n1. यह अरावली पहाड़ियों के पश्चिम में स्थित है \n2. इसमें औसत वार्षिक वर्षा 250 मिमी से अधिक होती है।",
                options: { en: ["Only 1", "Only 2", "Both 1 and 2", "Neither 1 nor 2"], hi: ["केवल 1", "केवल 2", "1 और 2 दोनों", "न तो 1 और न ही 2"] },
                answer: 0,
                expl: "The Thar Desert lies west of the Aravalli Hills. It receives very low precipitation (around 150 mm), not over 250 mm."
            },
            {
                en: "3. Why are the Western Ghats considered globally significant according to UNESCO?",

                options: { en: ["They categorize urban rivers", "They influence the Indian monsoon and are among the world's top biodiversity hotspots", "They host polar species", "They form the only volcanic plateau"], hi: ["वे शहरी नदियों को वर्गीकृत करते हैं", "वे भारतीय मानसून को प्रभावित करते हैं और दुनिया के शीर्ष जैव विविधता हॉटस्पॉट में से हैं", "वे ध्रुवीय प्रजातियों की मेजबानी करते हैं", "वे एकमात्र ज्वालामुखीय पठार बनाते हैं"] },

            },
            {

            {

                answer: 0,
                expl: "During retreating monsoon, high pressure replaces low pressure causing dry weather and clear skies."
            },
            {
                en: "6. Consider the following statements regarding temperature variation in southern India: \n1. Due to the presence of southern India in the tropical zone, the diurnal range of temperature is high \n2. Due to the continental influence, the annual mean range of temperature is greater in the coastal regions",
                hi: "6. दक्षिणी भारत में तापमान भिन्नता के संबंध में निम्नलिखित कथनों पर विचार करें: \n1. उष्णकटिबंधीय क्षेत्र में दक्षिणी भारत की उपस्थिति के कारण, तापमान की दैनिक सीमा अधिक होती है \n2. महाद्वीपीय प्रभाव के कारण, तटीय क्षेत्रों में तापमान की वार्षिक औसत सीमा अधिक होती है",
                options: { en: ["1 only", "2 only", "Both 1 and 2", "Neither 1 nor 2"], hi: ["केवल 1", "केवल 2", "1 और 2 दोनों", "न तो 1 और न ही 2"] },

            {
                en: "8. What is the primary source of energy driving the water cycle on Earth?",

                options: { en: ["Geothermal energy", "Solar energy", "Wind energy", "Ocean tides"], hi: ["भूतापीय ऊर्जा", "सौर ऊर्जा", "पवन ऊर्जा", "समुद्री ज्वार"] },
                answer: 1,
                expl: "Solar energy drives evaporation, which is the primary process in the water cycle."
            },
            {
                en: "9. The 'Deccan Traps' region of India is primarily made up of what type of rock?",
                hi: "9. भारत का 'दक्कन ट्रैप' क्षेत्र मुख्य रूप से किस प्रकार की चट्टान से बना है?",
                options: { en: ["Granite", "Basalt", "Marble", "Sandstone"], hi: ["ग्रेनाइट", "बेसाल्ट", "संगमरमर", "बलुआ पत्थर"] },
                answer: 1,
                expl: "Deccan Traps are a continental flood basalt province formed by volcanic eruptions."
            },
            {
                en: "10. Which of the following oceans is the third-largest ocean in the world?",
                hi: "10. निम्नलिखित में से कौन सा महासागर दुनिया का तीसरा सबसे बड़ा महासागर है?",
                options: { en: ["Pacific Ocean", "Atlantic Ocean", "Indian Ocean", "Arctic Ocean"], hi: ["प्रशांत महासागर", "अटलांटिक महासागर", "हिंद महासागर", "आर्कटिक महासागर"] },
                answer: 2,
                expl: "Indian Ocean is the third-largest ocean in the world."
            },
            {
                en: "11. What is the characteristic feature of the Bhabar region in the Northern Plains?",
                hi: "11. उत्तरी मैदानों में भाबर क्षेत्र की विशिष्ट विशेषता क्या है?",
                options: { en: ["Dense forests with slow-moving streams", "Narrow belt of alluvial deposits with fast-flowing rivers", "Dry region with minimal river flow and rocks", "Mountainous area with thick forests"], hi: ["धीमी गति से बहने वाली धाराओं के साथ घने जंगल", "तेजी से बहने वाली नदियों के साथ जलोढ़ जमा की संकीर्ण पट्टी", "न्यूनतम नदी प्रवाह और चट्टानों वाला शुष्क क्षेत्र", "घने जंगलों और चट्टानों वाला पहाड़ी क्षेत्र"] },

            {

                options: { en: ["Alaknanda", "Bhagirathi", "Mandakini", "Dhauliganga"], hi: ["अलकनंदा", "भागीरथी", "मंदाकिनी", "धौलीगंगा"] },

function qhtml(t,i,rev){return`<p class="tag">${u("q")} ${i+1}/${T.length}</p>`+(t.s?`<p>${u("sel")}</p>${t.s.map(x=>`<p class="st">${tr(x)}</p>`).join("")}`:`<h2>${tr(t.q)}</h2>`)}
function quiz(){const i=S.i,t=T[i];
app.innerHTML=`<div class="top"><b>⏱ <span id="tm">${fmt(S.left)}</span></b>${langBar()}</div><div class="card">${qhtml(t,i)}${t.o.map((o,k)=>`<button class="opt ${S.ans[i]===k?"sel":""}" onclick="pick(${k})">${"ABCD"[k]}. ${tr(o)}</button>`).join("")}
<p style="display:flex;justify-content:space-between"><button class="btn g" ${i?"":"disabled"} onclick="go(-1)">${u("prev")}</button>${i<T.length-1?`<button class="btn" onclick="go(1)">${u("next")}</button>`:`<button class="btn" onclick="submit()">${u("sub")}</button>`}</p></div>
<div class="pal">${T.map((_,k)=>`<span class="${S.ans[k]>=0?"a":""} ${k===i?"c":""}" onclick="S.i=${k};quiz()">${k+1}</span>`).join("")}</div><p><button class="btn g" onclick="if(confirm('${u("sub")}?'))submit()">${u("sub")}</button></p>`}
function pick(k){S.ans[S.i]=S.ans[S.i]===k?-1:k;quiz()}
function go(d){S.i+=d;quiz()}
async function submit(){if(S.done)return;clearInterval(ta);S.done=true;let c=0,w=0;S.ans.forEach((a,i)=>{if(a>=0)a===T[i].a?c++:w++});
S.c=c;S.w=w;S.k=T.length-c-w;S.score=+(c*POS-w*NEG).toFixed(2);S.used=TIME-Math.max(S.left,0);result();
try{db=db||await claude.use("db");if(db){await db.doc("results/"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({name:S.name,lang:L,score:S.score,c,w,k:S.k,total:T.length,used:S.used,ts:Date.now()});S.saved=1;result()}}catch(e){}}
function result(){app.innerHTML=`<div class="top"><h1>${S.name}</h1>${langBar()}</div><div class="card" style="text-align:center"><div class="big">${S.score}/${T.length*POS}</div><p>${u("corr")}: ${S.c} · ${u("wr")}: ${S.w} · ${u("sk")}: ${S.k}<br>${u("tm")}: ${fmt(S.used)}</p>${S.saved?`<p class="tag">${u("saved")}</p>`:""}<button class="btn" onclick="S=null;home()">${u("again")}</button></div>`+
T.map((t,i)=>{const a=S.ans[i];return`<div class="card">${qhtml(t,i)}${t.o.map((o,k)=>`<div class="opt ${k===t.a?"ok":k===a?"no":""}">${"ABCD"[k]}. ${tr(o)}</div>`).join("")}</div>`}).join("")}
// ---- Teacher dashboard (results are readable only by the artifact owner/editors) ----
async function admin(){app.innerHTML=`<div class="top"><h1>${u("teach")}</h1>${langBar()}</div><div id="ad" class="card">…</div><button class="btn g" onclick="home()">←</button>`;
try{db=db||await claude.use("db");if(!db)throw 0;db.collection("results").orderBy("ts","desc").onSnapshot(s=>draw(s.docs.map(d=>d.data())),()=>{$("ad").textContent="Owner only / केवल शिक्षक (owner)"})}catch(e){$("ad").textContent="Owner only / केवल शिक्षक (owner)"}}
function draw(r){const el=$("ad");if(!el)return;if(!r.length){el.textContent="No results yet / अभी कोई परिणाम नहीं";return}
const avg=(r.reduce((a,x)=>a+x.score,0)/r.length).toFixed(2),top=Math.max(...r.map(x=>x.score));
const rk=[...r].sort((a,b)=>b.score-a.score);
el.innerHTML=`<p><b>${r.length}</b> students · avg <b>${avg}</b> · top <b>${top}</b></p><div class="tw"><table><tr><th>#</th><th>Name</th><th>Score</th><th>✔</th><th>✘</th><th>Skip</th><th>Time</th><th>Lang</th><th>Date</th></tr>${rk.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td><b>${x.score}</b></td><td>${x.c}</td><td>${x.w}</td><td>${x.k}</td><td>${fmt(x.used)}</td><td>${x.lang==="hi"?"हिं":"EN"}</td><td>${new Date(x.ts).toLocaleString()}</td></tr>`).join("")}</table></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
home();
</script></body></html>
